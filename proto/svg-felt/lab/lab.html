<!doctype html><meta charset=utf-8><style>
body{margin:0;padding:12px;background:#ddd;font:12px sans-serif;display:grid;grid-template-columns:60px repeat(9,130px);gap:6px}
.s{height:130px;background-size:256px;background-blend-mode:soft-light}
.s.l{background-blend-mode:multiply}
.r{height:130px;background-size:cover;background-position:center}
</style><body><script>
const sets = new URLSearchParams(location.search).get('t').split(',');
const cols = ['#3d64a0','#7a6e60','#5a7f33','#c4452f','#e0a224','#2b7a80','#212529'];
document.body.insertAdjacentHTML('beforeend', '<div>echt</div>' + ['ref-blue','c-grey','c-olive','c-red','c-yellow','ref-mustard','ref-navy','c-white','ref-dark'].map(n => `<div class=r style="background-image:url(real/${n}.png)"></div>`).join(''));
for (const t of sets) {
  const [g, l, d] = t === 'photo' ? ['../../../img/felt.webp','../../../img/felt-light.webp','../../../img/felt-dark.webp'] : t.split('/').map(x => x + '.svg');
  document.body.insertAdjacentHTML('beforeend', `<div>${t}</div>` +
    cols.map(c => `<div class=s style="background-color:${c};background-image:url(${g})"></div>`).join('') +
    `<div class="s l" style="background-color:#fff;background-image:url(${l})"></div>` +
    `<div class="s" style="background-color:#2b3035;background-image:url(${d})"></div>`);
}
</script>
