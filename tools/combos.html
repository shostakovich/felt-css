<!doctype html>
<html lang="en" data-look="felt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felt combinations</title>
<!-- A check page for the felt look: every surface with every button, badge and rule, all border colours, alerts,
     list groups and every seam radius. ?theme=light|dark, ?look=felt|clean -->
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.bsTheme = q.get('theme') === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.look = q.get('look') === 'clean' ? 'clean' : 'felt';
</script>
<link rel="stylesheet" href="../felt.css">
<style>
  body { padding: 20px; }
  h6 { margin: 22px 0 10px; font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; opacity: .6; }
  .surface { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 16px; margin-bottom: 10px; }
  .surface > .lbl { width: 9.5rem; font-size: .75rem; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .grid .card-body { padding: .75rem 1rem; font-size: .875rem; }
  .r { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
</style>
</head>
<body>
<script>
  const C = ['primary', 'secondary', 'success', 'danger', 'warning', 'info', 'light', 'dark'];
  const btns = C.map(c => `<button class="btn btn-${c} btn-sm">${c}</button>`).join('');
  const outl = C.map(c => `<button class="btn btn-outline-${c} btn-sm">${c}</button>`).join('');
  const badges = C.map(c => `<span class="badge text-bg-${c}">${c}</span>`).join('');
  const surfaces = [['Page', ''], ['Card (cream)', 'card'], ...C.map(c => [`text-bg-${c}`, `card text-bg-${c}`])];
  let h = '<h6>Surfaces × buttons, outline, badges, hr/vr</h6>';
  for (const [l, cls] of surfaces) h += `<div class="surface ${cls}"><span class="lbl">${l}</span>${btns}<span class="vr mx-1" style="height:1.5rem"></span>${badges}<div class="w-100"></div><span class="lbl"></span>${outl}<hr class="flex-grow-1 my-0"></div>`;
  h += '<h6>Border colours: .border .border-{colour} (card, div, button) on the page, cream and dark</h6><div class="grid">';
  for (const c of [...C, 'white', 'black']) {
    h += `<div class="card border border-${c}"><div class="card-body">card .border-${c}</div></div>`;
    h += `<div class="border border-2 border-${c} rounded p-2 small">div .border-2 .border-${c}</div>`;
    h += `<div class="card text-bg-dark border border-${c}"><div class="card-body">dark .border-${c}</div></div>`;
  }
  h += '</div><div class="d-flex flex-wrap gap-2 mt-3">' + [...C, 'white'].map(c => `<button class="btn btn-primary border border-${c}">btn .border-${c}</button>`).join('') + '</div>';
  h += '<h6>Alerts</h6><div class="grid" style="grid-template-columns:repeat(4,1fr)">' + C.map(c => `<div class="alert alert-${c} mb-0 py-2">alert-${c}</div>`).join('') + '</div>';
  h += '<h6>List group variants, progress, coloured rules</h6><div class="grid" style="grid-template-columns:1fr 1fr 1fr">';
  h += '<ul class="list-group"><li class="list-group-item active">active</li>' + C.map(c => `<li class="list-group-item list-group-item-${c}">list-group-item-${c}</li>`).join('') + '</ul>';
  h += '<div>' + C.map(c => `<div class="progress mb-2" style="height:1rem"><div class="progress-bar bg-${c}" style="width:${30 + C.indexOf(c) * 8}%"></div></div>`).join('') + '</div>';
  h += '<div class="card"><div class="card-body">' + C.map(c => `<div class="small text-${c === 'light' ? 'body' : c}">text-${c}</div><hr class="text-${c} my-2">`).join('') + '</div></div></div>';
  document.write(h);
</script>

<h6>Seam radii</h6>
<div class="r">
  <button class="btn btn-primary btn-sm">Small</button><button class="btn btn-primary">Normal</button><button class="btn btn-primary btn-lg">Large</button>
  <button class="btn btn-outline-primary btn-sm">Small</button><button class="btn btn-outline-primary">Normal</button><button class="btn btn-outline-primary btn-lg">Large</button>
</div>
<div class="r">
  <button class="btn btn-secondary btn-pill btn-sm">Small pill</button><button class="btn btn-secondary btn-pill">Pill</button><button class="btn btn-secondary btn-pill btn-lg">Large pill</button>
  <button class="btn btn-danger btn-icon btn-sm" aria-label="Add">＋</button><button class="btn btn-danger btn-icon" aria-label="Add">＋</button><button class="btn btn-danger btn-icon btn-lg" aria-label="Add">＋</button>
  <button class="btn btn-success rounded-pill">rounded-pill</button><button class="btn btn-warning rounded-0">rounded-0</button><button class="btn btn-info rounded-3">rounded-3</button>
</div>
<div class="r">
  <div class="btn-group"><button class="btn btn-secondary">Left</button><button class="btn btn-secondary">Middle</button><button class="btn btn-secondary">Right</button></div>
  <div class="btn-group btn-group-sm"><button class="btn btn-secondary">Left</button><button class="btn btn-secondary">Right</button></div>
  <div class="btn-group" role="group"><button class="btn btn-outline-primary">Day</button><button class="btn btn-outline-primary active">Week</button><button class="btn btn-outline-primary">Month</button></div>
  <ul class="pagination pagination-sm mb-0"><li class="page-item"><a class="page-link" href="#">1</a></li><li class="page-item active"><span class="page-link">2</span></li><li class="page-item"><a class="page-link" href="#">3</a></li></ul>
  <div class="input-group" style="width:16rem"><input class="form-control" placeholder="Search"><button class="btn btn-primary">Go</button></div>
</div>
<div class="r"><div class="card" style="width:14rem"><div class="card-body">Card</div></div><div class="alert alert-info mb-0">Alert</div><span class="badge rounded-pill text-bg-primary">Badge</span></div>
</body>
</html>
